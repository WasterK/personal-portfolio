<section class="portfolio-section" id="portfolio">
    <h2>Portfolio</h2>
    <div class="projects-grid">
        <div class="project-item" *ngFor="let project of projects">
            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>
            
            <!-- Button Group: "Try it" & GitHub buttons -->
            <div class="button-group">
                <a *ngIf="project.tryLink" [href]="project.tryLink" target="_blank" class="try-it">Try it</a>
                <a *ngIf="project.link" [href]="project.link" class="btn-github" target="_blank">
                    <img src="github-mark.png" alt="GitHub" />
                </a>
            </div>
        </div>
    </div>
</section>
